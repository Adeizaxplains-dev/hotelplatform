map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Keep hostname intact: tenant resolution is hostname-based. The edge proxy should
    # provide X-Forwarded-Proto and the configured TRUST_PROXY hop count must match topology.
    location ^~ /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 16m;
    }

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location ~ /\. {
        deny all;
    }
}
